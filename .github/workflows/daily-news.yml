name: Daily AI News Pipeline

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST (Indian Standard Time) every morning
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      max_stories:
        description: 'Maximum stories to draft'
        required: false
        default: '6'
      dry_run:
        description: 'Dry run mode (print drafts without saving to database)'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute News Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OUTPUT_LANGUAGES: 'mr,en'
        run: |
          MAX_COUNT="${{ github.event.inputs.max_stories || '6' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx pipeline/run.ts --max-stories=$MAX_COUNT $DRY_RUN_FLAG

