name: Daily AI News Pipeline

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (Indian Standard Time) every morning
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      pune_stories:
        description: 'Number of Pune stories to draft'
        required: false
        default: '5'
      baramati_stories:
        description: 'Number of Baramati stories to draft'
        required: false
        default: '5'
      dry_run:
        description: 'Dry run mode (print drafts without saving to database)'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute News Pipeline (5 Pune + 5 Baramati)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OUTPUT_LANGUAGES: 'mr'
        run: |
          PUNE_COUNT="${{ github.event.inputs.pune_stories || '5' }}"
          BARAMATI_COUNT="${{ github.event.inputs.baramati_stories || '5' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx pipeline/run.ts --pune-stories=$PUNE_COUNT --baramati-stories=$BARAMATI_COUNT --publish $DRY_RUN_FLAG


